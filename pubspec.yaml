name: medmap
description: MEDMAP - seguimiento de pacientes (HackaTec 2026)
publish_to: none
environment: {sdk: ">=3.3.0 <4.0.0"}
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  # Estado, navegación y red
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.3
  # Datos locales
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0
  # Notificaciones
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  # Accesibilidad y audio
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  # Funciones
  local_auth: ^2.2.0
  image_picker: ^1.0.7
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
dev_dependencies:
  flutter_test: {sdk: flutter}
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sonidos/alarma.wav
