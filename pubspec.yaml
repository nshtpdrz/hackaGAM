name: medmap
description: SENDA - seguimiento de pacientes entre consultas (HackaTec 2026)
publish_to: none
# Versión de la app: nombre+número (versionName/versionCode en Android, CFBundleShortVersionString/CFBundleVersion en iOS).
# Subir el número (+N) en cada APK/AAB que se reparta; ver docs/EMPAQUETADO.md.
version: 1.0.0+1
environment: {sdk: ">=3.3.0 <4.0.0"}
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  # Estado, navegación y red
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.3
  # Datos locales: flutter_secure_storage (lib/core/almacen_local.dart). drift/sqlite se quitaron (no se usaban).
  # Notificaciones
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1 # zona del teléfono para que las alarmas respeten horario de verano y viajes
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  # Accesibilidad y audio
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  # Funciones
  local_auth: ^2.2.0
  local_auth_android: ^1.0.46 # textos del diálogo de huella en el idioma de la app
  local_auth_darwin: ^1.4.0 # textos de Face ID / Touch ID
  image_picker: ^1.0.7
  url_launcher: ^6.3.0 # llamar al cuidador (tel:) y abrir Ajustes de la app en iOS
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.0 # brillo al máximo mientras se muestra el QR
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^4.0.0
  # Marca SENDA en Android/iOS (ya generadas; repetir solo si cambian los PNG de assets/marca):
  #   dart run flutter_launcher_icons && dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter:
  uses-material-design: true
  assets:
    - assets/sonidos/alarma.wav
    - assets/marca/

# Icono de la app SENDA (Android e iOS). El de web ya está en web/icons y web/favicon.png.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/marca/senda_icono.png"
  adaptive_icon_background: "#593286"
  adaptive_icon_foreground: "assets/marca/senda_icono_primer_plano.png"
  remove_alpha_ios: true
  web:
    generate: false

# Pantalla de arranque nativa SENDA (Android e iOS). La de web está en web/index.html.
flutter_native_splash:
  color: "#593286"
  image: assets/marca/senda_splash.png
  android_12:
    color: "#593286"
    image: assets/marca/senda_splash_android12.png
  web: false
